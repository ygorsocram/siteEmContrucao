<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em construção</title>
<meta name="description" content="Estamos preparando algo novo. Volte em breve.">
<style>
  :root{
    --bg-1:#0b0f1a;
    --bg-2:#131a2b;
    --accent-1:#7c5cff;
    --accent-2:#36d6c7;
    --accent-3:#ff6ec7;
    --text-primary:#f5f6fa;
    --text-muted:#9aa3b8;
    --card-bg:rgba(255,255,255,0.05);
    --card-border:rgba(255,255,255,0.12);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    overflow-x:hidden;
  }

  body{
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg-1);
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:24px;
  }

  /* fundo animado em gradiente */
  .bg-glow{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,92,255,0.35), transparent 45%),
      radial-gradient(circle at 80% 15%, rgba(54,214,199,0.28), transparent 45%),
      radial-gradient(circle at 50% 85%, rgba(255,110,199,0.22), transparent 50%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    animation: drift 18s ease-in-out infinite alternate;
  }

  @keyframes drift{
    0%{ filter:hue-rotate(0deg); transform:scale(1); }
    100%{ filter:hue-rotate(25deg); transform:scale(1.06); }
  }

  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 30%, rgba(255,255,255,0.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,0.35) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.35) 50%, transparent 51%);
    opacity:0.6;
    animation: twinkle 6s ease-in-out infinite alternate;
  }

  @keyframes twinkle{
    0%{ opacity:0.35; }
    100%{ opacity:0.75; }
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:620px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:999px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    backdrop-filter:blur(10px);
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin-bottom:28px;
  }

  .badge .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--accent-2);
    box-shadow:0 0 12px var(--accent-2);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(0.75); }
  }

  .orbit{
    position:relative;
    width:120px;
    height:120px;
    margin-bottom:32px;
  }

  .orbit .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid transparent;
    border-top-color:var(--accent-1);
    border-right-color:var(--accent-2);
    animation: spin 2.4s linear infinite;
  }

  .orbit .ring.r2{
    inset:16px;
    border-top-color:var(--accent-3);
    border-right-color:transparent;
    border-left-color:var(--accent-1);
    animation: spin 3.2s linear infinite reverse;
  }

  .orbit .core{
    position:absolute;
    inset:38px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow:0 0 40px rgba(124,92,255,0.6);
  }

  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  h1{
    font-size:clamp(2rem, 6vw, 3.2rem);
    font-weight:700;
    line-height:1.1;
    margin-bottom:16px;
    background:linear-gradient(90deg, #fff, var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p.lead{
    color:var(--text-muted);
    font-size:clamp(1rem, 2.4vw, 1.15rem);
    line-height:1.6;
    max-width:460px;
    margin-bottom:36px;
  }

  .progress-card{
    width:100%;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:20px 24px;
    backdrop-filter:blur(12px);
    margin-bottom:32px;
  }

  .progress-top{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:10px;
  }

  .progress-top span:last-child{
    color:var(--text-primary);
    font-weight:600;
  }

  .progress-track{
    height:8px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    overflow:hidden;
  }

  .progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
    background-size:200% 100%;
    animation: fillbar 1.6s ease-out forwards, flow 3s linear infinite;
  }

  @keyframes fillbar{
    from{ width:0%; }
    to{ width:72%; }
  }

  @keyframes flow{
    0%{ background-position:0% 0%; }
    100%{ background-position:200% 0%; }
  }

  form{
    width:100%;
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }

  input[type="email"]{
    flex:1;
    padding:14px 18px;
    border-radius:12px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.04);
    color:var(--text-primary);
    font-size:14px;
    outline:none;
    transition:border-color .2s, background .2s;
  }

  input[type="email"]::placeholder{ color:var(--text-muted); }

  input[type="email"]:focus{
    border-color:var(--accent-2);
    background:rgba(255,255,255,0.07);
  }

  button{
    padding:14px 22px;
    border-radius:12px;
    border:none;
    font-weight:600;
    font-size:14px;
    color:#0b0f1a;
    background:linear-gradient(90deg, var(--accent-2), var(--accent-1));
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }

  button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(124,92,255,0.35);
  }

  button:active{ transform:translateY(0); }

  .form-note{
    font-size:12px;
    color:var(--text-muted);
    margin-top:-8px;
    margin-bottom:28px;
    min-height:16px;
  }

  .social{
    display:flex;
    gap:14px;
  }

  .social a{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    color:var(--text-primary);
    text-decoration:none;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }

  .social a:hover{
    transform:translateY(-3px);
    border-color:var(--accent-2);
    background:rgba(255,255,255,0.1);
  }

  .social svg{ width:18px; height:18px; fill:currentColor; }

  footer{
    position:relative;
    z-index:1;
    margin-top:40px;
    font-size:12px;
    color:var(--text-muted);
  }

  @media (max-width: 480px){
    form{ flex-direction:column; }
    button{ width:100%; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="stars"></div>

<div class="wrap">
  <div class="badge"><span class="dot"></span> Em desenvolvimento</div>

  <div class="orbit">
    <div class="ring"></div>
    <div class="ring r2"></div>
    <div class="core"></div>
  </div>

  <h1>Estamos construindo<br>algo novo</h1>
  <p class="lead">
    Este site está em produção. Em breve teremos uma experiência completa
    por aqui &mdash; por enquanto, agradecemos a paciência.
  </p>

  <div class="progress-card">
    <div class="progress-top">
      <span>Progresso</span>
      <span id="progress-label">72%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

  <form id="notify-form" onsubmit="return handleSubmit(event)">
    <input type="email" id="notify-email" placeholder="seu@email.com" required>
    <button type="submit">Avisar quando lançar</button>
  </form>
  <div class="form-note" id="form-note"></div>

  <div class="social">
    <a href="https://github.com/ygorsocram" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24"><path d="M12 .5C5.73.5.98 5.24.98 11.5c0 4.84 3.14 8.95 7.5 10.4.55.1.75-.24.75-.53 0-.26-.01-1.14-.02-2.06-3.05.66-3.7-1.3-3.7-1.3-.5-1.27-1.22-1.6-1.22-1.6-.99-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.67 2.57 1.19 3.2.91.1-.71.38-1.19.69-1.46-2.43-.28-4.98-1.22-4.98-5.42 0-1.2.42-2.17 1.12-2.94-.11-.28-.49-1.4.11-2.92 0 0 .93-.3 3.04 1.12a10.5 10.5 0 0 1 5.54 0c2.11-1.42 3.04-1.12 3.04-1.12.6 1.52.22 2.64.11 2.92.7.77 1.12 1.74 1.12 2.94 0 4.21-2.56 5.14-5 5.41.39.34.73 1.01.73 2.04 0 1.47-.01 2.66-.01 3.02 0 .29.2.64.76.53 4.36-1.45 7.5-5.56 7.5-10.4C23.02 5.24 18.27.5 12 .5Z"/></svg>
    </a>
    <a href="mailto:contato@seudominio.com" aria-label="Email">
      <svg viewBox="0 0 24 24"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5v-13Zm2.2.5 7.8 6.1 7.8-6.1H4.2Zm15.6 1.6-7.1 5.56a1.5 1.5 0 0 1-1.8 0L4 7.6v10.9c0 .17.13.3.3.3h15.4c.17 0 .3-.13.3-.3V7.6Z"/></svg>
    </a>
  </div>
</div>

<footer>&copy; <span id="year"></span> &mdash; todos os direitos reservados.</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  function handleSubmit(e){
    e.preventDefault();
    var note = document.getElementById('form-note');
    var email = document.getElementById('notify-email').value;
    note.textContent = 'Pronto! Avisaremos ' + email + ' quando o site for lançado.';
    note.style.color = '#36d6c7';
    document.getElementById('notify-form').reset();
    return false;
  }
</script>

</body>
</html>
