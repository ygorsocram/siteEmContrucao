<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mediterranê Saúde &amp; Bem-Estar</title>
<meta name="description" content="Mediterranê Saúde & Bem-Estar — clínica multidisciplinar. Novo site em breve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6f1e7;
    --ink:#2f3b4c;
    --ink-soft:#5c6b7d;
    --gold:#9c7a46;
    --line:#e2d9c6;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .page{
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    opacity:0;
    animation:fadein .8s ease-out .1s forwards;
  }

  @keyframes fadein{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .art{
    width:100%;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 18px 40px -16px rgba(47,59,76,0.28);
  }

  .art img{
    display:block;
    width:100%;
    height:auto;
  }

  .eyebrow{
    margin-top:34px;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }

  .rule{
    width:36px;
    height:1px;
    background:var(--line);
    margin:14px auto;
  }

  h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:600;
    font-size:clamp(1.4rem, 4vw, 1.75rem);
    line-height:1.35;
    color:var(--ink);
    max-width:360px;
  }

  p.lead{
    margin-top:14px;
    font-size:14px;
    line-height:1.7;
    color:var(--ink-soft);
    max-width:340px;
  }

  footer{
    margin-top:38px;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    opacity:0.75;
  }

  @media (max-width:420px){
    .page{ max-width:100%; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="art">
    <img src="assets/mediterrane-bg.jpeg" alt="Mediterranê Saúde &amp; Bem-Estar">
  </div>

  <div class="eyebrow">Em breve</div>
  <div class="rule"></div>

  <h1>Uma nova experiência digital para sua saúde e bem-estar.</h1>
  <p class="lead">
    Estamos preparando o novo site da nossa clínica multidisciplinar.
    Em breve, mais informações sobre nossas especialidades e atendimento.
  </p>

  <footer>&copy; <span id="year"></span> Mediterranê Saúde &amp; Bem-Estar</footer>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
